# QLoRA Training Configuration for Persona Adaptation
# Targeting Llama-3-8B / Mistral-7B Base Models

model_config:
  base_model_name: "meta-llama/Meta-Llama-3-8B"
  output_dir: "./training/output"
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "float16"

training_arguments:
  output_dir: "./training/output/checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  fp16: true
  report_to: "none"

lora_config:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data_config:
  dataset_path: "./data/raw_datasets/persona_data.jsonl"
  max_seq_length: 2048
  packing: false